# ---------------------------------------------------------------
# Polymarket -> Kalshi copy bot config
# ---------------------------------------------------------------

# "paper" = log what it would do, no orders.  "live" = real orders.
mode: paper

poll_seconds: 10
mappings_file: mappings.yaml
auto_match_sports: true   # find the same game on Kalshi automatically
state_file: state.json
journal_file: journal.csv

kalshi:
  env: demo                 # "demo" (fake money) or "prod"
  # Prefer env vars KALSHI_KEY_ID / KALSHI_KEY_PATH over putting these here
  key_id: ""
  private_key_path: "~/.kalshi/private_key.pem"

# Polymarket wallets to follow (use the proxy wallet shown on their profile)
whales:
  # Picked from the sports screener on 2026-10-21 (see /report on the dashboard)
  - name: KaneAnalytics        # NFL + college football
    address: "0x7e3a1f95c558f39a51ff334d789e3e039b553246"
    min_trade_usd: 500        # their typical bet is ~$4.4k
  - name: Steady-USsports      # CFB, NFL, MLB, NBA
    address: "0x20d6436849f930584892730c7f96ebb2ac763856"
    min_trade_usd: 50         # typical bet ~$240
  - name: Kkunn                # tennis + Counter-Strike
    address: "0xe7870d0e1bfc65a23e3d66caf00ca1b9129e5034"
    min_trade_usd: 500        # typical bet ~$2.9k
  - name: PEYZ                 # League of Legends, NFL, CFB, NHL
    address: "0xdaef2be2a19ad331737d06545f85615b094554e9"
    min_trade_usd: 250         # typical bet ~$1.8k

  - name: Kch-Temp             # NFL + college football (spreads, totals, winners)
    address: "0x924379a79c64b77ad5816ad362122a5f6228658e"
    min_trade_usd: 1000        # typical bet ~$11k
  - name: primm                # college football + NFL spreads/totals
    address: "0xd38b71f3e8ed1af71983e5c309eac3dfa9b35029"
    min_trade_usd: 50         # typical bet ~$310
  - name: ArielFilipino        # college football + NFL spreads
    address: "0xe18ecc345e00ee7c4f2d1f676f3dd2acb112f826"
    min_trade_usd: 500        # typical bet ~$4.5k
  - name: ic4cream             # CFB, NBA, NFL, NHL
    address: "0x27f738fe203827445690339104aae35b20bc44b0"
    min_trade_usd: 75         # typical bet ~$420

# Copy whales' bets that were already open before the bot saw them (pre-game only)
catch_up:
  enabled: true
  every_seconds: 900
  days_ahead: 3
  min_minutes_before: 10     # never copy within 10 min of start or after the game started

# Copying whale bets placed during a game (strict: fresh + no worse price + smaller size).
# Shown on the scoreboard as "<whale> · live" so you can compare with pre-game copies.
live_games:
  enabled: true
  max_age_seconds: 30
  max_slippage: 0.0
  size_mult: 0.5

# When buying at Kalshi's ask isn't worth it, rest a post-only limit order at a fair price
# (maker fees are 0 on most Kalshi markets, at most 1/4 of the taker fee on NFL/NBA).
limit_orders:
  enabled: true
  maker_fee_rate: 0.0175    # conservative: assume the max maker fee
  max_hours: 6              # order lifetime if the start time is unknown
  cancel_before_start_minutes: 5
  check_seconds: 30

# Daily combo: 2-3 of the best whale picks and player props (different games) in one Kalshi combo, small stake.
combos:
  enabled: true
  dry_run: true             # log what it would bet; set false after checking the logs
  every_days: 1             # one combo a day (retries every 6h if no strong legs)
  min_legs: 2
  max_legs: 3
  min_score: 70             # whale legs
  min_prop_score: 70        # player-prop legs (see props.py)
  min_hit_chance: 0.30      # skip combos less likely than 30% to hit
  stake_pct: 0.02           # 2% of balance per combo

# Bankroll mode (sizing: score). Paper mode tracks a virtual bankroll starting here.
bankroll:
  start_usd: 98.49          # live: your deposit (used for the Return %)
  # Growth plan: heavy while small, taper as the account grows. [min score, % of balance per bet]
  stages:
    - name: "1 growth"
      up_to: 300
      max_game_pct: 0.15
      max_open_pct: 1.0       # growth stage: whole balance can be in play
      tiers: [[80, 0.12], [65, 0.07], [45, 0.04]]
    - name: "2 taper"
      up_to: 1000
      max_game_pct: 0.12
      max_open_pct: 0.9
      tiers: [[80, 0.08], [65, 0.05], [45, 0.03]]
    - name: "3 protect"
      up_to: null
      max_game_pct: 0.08
      max_open_pct: 0.8
      tiers: [[80, 0.05], [65, 0.035], [50, 0.02]]
  drawdown_brake_pct: 0.30  # 30% below peak -> use stage 3 sizing until it recovers
  min_ev: 0.0               # skip bets with negative expected value after fees
  max_game_pct: 0.12        # at most 12% of balance on one market
  max_open_pct: 0.90        # keep at least 10% of balance free
  daily_stop_pct: 0.25      # stop new bets for the day after a 25% drop
  min_stake_usd: 1.5
  board:                    # also auto-bet the strongest "Best bets now" picks
    enabled: true
    min_score: 70
    min_whales: 2           # at least 2 proven traders on the same side
    min_ev: 0.0
    max_age_hours: 12       # only fresh whale bets

risk:
  sizing: score             # "score" (bankroll % by bet score), "fixed" or "proportional"
  fixed_usd: 25             # $ per copied trade when sizing = fixed
  copy_ratio: 0.01          # default ratio when sizing = proportional
  min_whale_trade_usd: 1000
  max_usd_per_trade: 50
  max_usd_per_market: 150
  max_usd_per_day: 1000       # paper-test limit; lower before going live
  max_slippage: 0.03        # won't pay more than whale price + 3c
  max_entry_price: 0.92     # skip near-certain markets (little upside)
  max_trade_age_seconds: 300
  always_follow_exits: true # sell when whale sells, even below their price
  time_in_force: fill_or_kill
  fee_rate: 0.07            # Kalshi taker fee estimate: rate x contracts x P x (1-P)
  max_fee_pct: 6            # skip bets where the fee eats more than this % of the stake
