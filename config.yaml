# ---------------------------------------------------------------
# Polymarket -> Kalshi copy bot config
# ---------------------------------------------------------------

# "paper" = log what it would do, no orders.  "live" = real orders.
mode: paper

poll_seconds: 10
mappings_file: mappings.yaml
auto_match_sports: true   # find the same game on Kalshi automatically
state_file: state.json
journal_file: journal.csv

kalshi:
  env: demo                 # "demo" (fake money) or "prod"
  # Prefer env vars KALSHI_KEY_ID / KALSHI_KEY_PATH over putting these here
  key_id: ""
  private_key_path: "~/.kalshi/private_key.pem"

# Polymarket wallets to follow (use the proxy wallet shown on their profile)
whales:
  # Picked from the sports screener on 2026-10-21 (see /report on the dashboard)
  - name: KaneAnalytics        # NFL + college football
    address: "0x7e3a1f95c558f39a51ff334d789e3e039b553246"
    min_trade_usd: 250        # their typical bet is ~$4.4k
  - name: Steady-USsports      # CFB, NFL, MLB, NBA
    address: "0x20d6436849f930584892730c7f96ebb2ac763856"
    min_trade_usd: 25         # typical bet ~$240
  - name: Kkunn                # tennis + Counter-Strike
    address: "0xe7870d0e1bfc65a23e3d66caf00ca1b9129e5034"
    min_trade_usd: 250        # typical bet ~$2.9k
  - name: PEYZ                 # League of Legends, NFL, CFB, NHL
    address: "0xdaef2be2a19ad331737d06545f85615b094554e9"
    min_trade_usd: 100         # typical bet ~$1.8k

  - name: Kch-Temp             # NFL + college football (spreads, totals, winners)
    address: "0x924379a79c64b77ad5816ad362122a5f6228658e"
    min_trade_usd: 500        # typical bet ~$11k
  - name: primm                # college football + NFL spreads/totals
    address: "0xd38b71f3e8ed1af71983e5c309eac3dfa9b35029"
    min_trade_usd: 25         # typical bet ~$310
  - name: ArielFilipino        # college football + NFL spreads
    address: "0xe18ecc345e00ee7c4f2d1f676f3dd2acb112f826"
    min_trade_usd: 250        # typical bet ~$4.5k
  - name: ic4cream             # CFB, NBA, NFL, NHL
    address: "0x27f738fe203827445690339104aae35b20bc44b0"
    min_trade_usd: 25         # typical bet ~$420

# The bot manages the whale list: benches whales that lose us money, adds strong screener traders.
whale_manager:
  enabled: true
  force_bench: [PEYZ, ArielFilipino, Steady-USsports, "Kkunn · live", para-Vision, lfg100k]  # benched 10/23 review (Kalshi after-fee losses); remove a name to bring it back
  bench_min_copies: 20      # judge a whale only after 20 settled copies
  bench_roi: -0.10          # bench at -10% ROI or worse (still follows their exits)
  auto_add: true
  max_auto: 6               # at most 6 auto-added whales
  min_score: 85             # screener score
  max_per_day: 60           # skip bots that trade constantly
  min_median_usd: 100       # real bet sizes
  min_copyable_pct: 80      # most of their bets exist on Kalshi

# Copy whales' bets that were already open before the bot saw them (pre-game only)
catch_up:
  enabled: true
  every_seconds: 900
  days_ahead: 3
  min_minutes_before: 10     # never copy within 10 min of start or after the game started

# Copying whale bets placed during a game (strict: fresh + no worse price + smaller size).
# Shown on the scoreboard as "<whale> · live" so you can compare with pre-game copies.
live_games:
  enabled: true
  max_age_seconds: 300       # Polymarket reports trades a few minutes late; price check still protects
  max_slippage: 0.0
  size_mult: 0.5

# Following whales during games
live_moves:
  follow_hedges: true       # whale buys the other side of a bet we copied -> we sell the same share

# Parlays: once every leg but one has won, sell part to lock in profit
parlay_lock:
  enabled: true
  sell_fraction: 0.5        # sell half, let half ride
  min_multiple: 2.0         # only if we get at least 2x what we paid
  min_of_fair: 0.85         # and at least 85% of fair value (the last leg's live price)
  check_seconds: 120

# Live lag watcher: does Kalshi trail Polymarket's price during games?
lag_watch:
  enabled: true
  trade_off: true          # 10/23: ALL lag trading off (sports + crypto); still watches and logs gaps
  mode: watch               # starts measuring only; switches itself to trade when the evidence is in
  auto_switch: true
  min_gaps: 8               # evidence needed: at least 8 gaps
  min_games: 2              #   across at least 2 different games
  min_converge_rate: 0.6    #   and 60%+ could have been sold for 1c+ profit after both fees
  crypto_min_gaps: 30       # crypto is priced by our model, so it needs more proof: 30 gaps
  crypto_min_games: 8       #   across 8 different 15-min/hourly windows
  poll_seconds: 5
  min_gap: 0.03             # Kalshi at least 3c cheaper than Polymarket after the fee
  max_live: 200             # live markets polled every poll_seconds
  max_pre: 200              # upcoming markets polled every pre_poll_seconds
  pre_poll_seconds: 30
  discover_every_s: 600     # re-scan Polymarket's sports list every 10 min
  size_levels: [0.03, 0.04, 0.05]  # stake per gap: starts at 5%, +1 step after a profitable day (10+ trades), -1 after a losing day
  size_up_min_trades: 10
  max_open_trades: 3        # at most 3 stakes in lag trades at once
  daily_stop_pct: 0.15      # lag trades pause for the day after losing 15% of the balance
  reserve_pct: 0.10         # once trading, 10% of balance is kept for lag trades only (whales/parlays can't use it)
  min_profit: 0.01          # sports lag: sell once it nets 1c+ per contract after fees
  hold_to_settle: true      # crypto lag: hold to settlement; sell early only if the bid pays at least fair value
  no_entry_last_s: 150      # crypto: no new buys in the last 2.5 minutes of a window
  crypto_min_price: 0.99    # crypto lag entries OFF (fade study 10/22: fade side won 20% vs Kalshi 28% / model 36%); watching + logging continue
  borrow_pot: true          # lag trades may use the future pot's idle cash (back within 15 min)
  exit_min_bid_share: 0.75  # late exit only if someone pays 75%+ of model value
  profit_ladder: true       # up 10%+ -> never below break-even; 30%+ keeps 40% of gain, 60%+ 60%, 100%+ 70%
  ladder_model_margin: 0.08 # skip the stop if the model still values it 8c+ above the floor (a book dip)
  model_stop: true          # 5+ min left: sell if the model values the trade at half the entry or less (and bid pays 75%+ of that)
  stop_value_share: 0.5
  mm_keep_usd: 0           # market maker paused: lag may use all free crypto cash
  stop_reset: "2026-10-22 21:15"  # lag daily stop counts from this reset (new rules start here)
  truth_reset: "2026-10-22 22:45"  # Kalshi-based lag limit (kill_usd) counts from here (follow test start)
  kill_usd: 6               # follow test: off for the day if Kalshi says crypto lag is down $6 since the reset
  crypto_follow: false      # follow test 10/22-23: 20/35 wins, -$7.38 after fees -> off (crypto lag has no edge either way)
  follow_contracts: 2       # small: ~$1.10-1.70 per trade
  follow_min_price: 0.55    # Kalshi's favorite side only, 55c-85c
  follow_max_price: 0.85
  maker_entry: true         # crypto lag entries rest one tick under the ask (no fee) instead of buying the ask
  maker_wait_s: 30          # cancel an unfilled maker entry after 30s (or once the gap closes)
  flip_exit: false          # convergence flip: rest a sell just under model value (maker, no fee) as soon as a lag trade fills
  flip_min: 0.02            # the resting exit is never below entry + 2c
  stop_c: 0.20              # wide stop only: cut once model value is 20c under cost (a clear collapse)
  stop_min_bid_share: 0.5   # stop sells if the bid pays at least half the model value (fast collapses), retrying leftovers
  ladder_min_gain_c: 9       # ladder never arms: winners ride to settlement (early sells kept $28 of $289 today)
  max_entries_per_window: 1 # one lag entry per market per window (no chasing, fewer fees)
  late_cut_s: 0             # late cut off: hold to settlement unless the wide stop fires


# Crypto lag: Kalshi BTC/ETH 15-minute up/down and hourly above/below vs the live Coinbase price.
# Same evidence rules and auto-switch as sports (groups "BTC 15m", "BTC hourly", "ETH 15m", ...).
crypto_lag:
  enabled: true
  poll_seconds: 0.25        # check every quarter second (gaps often last only 1-2 seconds)
  min_gap: 0.04             # fair value at least 4c above Kalshi's ask after the fee (user: allow under 6c)
  basis: 0.0003             # allowance for Kalshi settling on the CF Benchmarks index, not Coinbase
  exit_seconds: 150         # last 2.5 min of a window: sell trades that are going wrong
  exit_below: 0.25          #   = our model gives them under 25% (or the bid pays more than they're worth)
  min_price: 0.10           # skip contracts under 10c / over 90c (model least reliable there)
  mm:                       # two-sided market making (resting YES + NO quotes around fair value)
    enabled: false          # off 2026-10-22 9:30pm CT: SOL/XRP/DOGE handed to lag trades
    coins: [SOL, XRP, DOGE] # 15-minute markets of these coins (no lag trades there)
    size: 3                 # contracts per quote
    half_spread: 0.04       # quote 4c either side of fair value
    max_inventory: 6        # at most 6 contracts more on one side than the other
    lean_per_contract: 0.002
    reprice_c: 0.02         # move a quote once fair value moved 2c+
    min_replace_s: 4        # ... and not more often than every 4s per side
    poll_s: 2               # check our quotes for fills every 2s
    fair_min: 0.30          # no new quotes when fair value is under 30% / over 70% (no longshots)
    keep_free_for_closing: 5  # new pairs only while $5 stays free to complete them (Kalshi wants cash for every resting order)
    trend_z: 2.0            # 2-minute move over 2 std devs (this coin or BTC) = trend
    vol_spike: 2.0          # last-5-min volatility over 2x normal = pull quotes
    stop_before_close_s: 180
    expire_before_close_s: 150  # Kalshi cancels our quotes itself 2.5 min before close
    daily_stop_usd: 1000    # (old records-based stop, off: the Kalshi-based kill_usd limit is the real one)
    paused: true            # paused 2026-10-22 9pm CT after evaluation: no edge (18 pairs-only windows, 3 winners)
    kill_usd: 10            # off for the day if Kalshi says market making is down $10 after fees (counted from the baseline)
    truth_reset: "2026-10-22 19:30"  # change this to restart the count from now
    breaker_contracts: 6    # Kalshi order group: 6+ contracts filled within 15s -> Kalshi cancels all our quotes in that market
    open_until_left_s: 300  # last 5 min: only quotes that complete a pair (no new one-sided risk)
    pairs_only: true        # hold both sides, not one: complete a pair at once (taker) if it still costs < $0.99
    pair_take_min: 0.01     # completing at once must still make 1c+ per pair after the fee
    max_single_s: 30        # one side only for 30s and no profitable pair -> sell it (if loss <= 3c)
    max_single_loss: 0.03
    single_patience_s: 90   # single side stuck 90s+: close it if losing up to 6c
    stuck_single_loss: 0.06
    late_single_loss: 0.10  # last 5 min: close a single side losing up to 10c rather than hold it to settlement
    stop_c: 0.10            # one-sided holding whose model value is 10c+ under cost: cut it
    pair_arb_max: 0.98      # YES + NO both buyable for <= $0.98 after fees -> buy both at once
    pull_c: 0.01            # pull a quote at once if the model value drops 1c under it
    pair_min_c: 0.02        # completing a pair must make at least 2c
    take_profit_pct: 0.5    # one-sided holding up 50%+ on cost: sell it
    lock_last_s: 240        # last 4 minutes: sell any one-sided holding that's in profit after the fee

# When buying at Kalshi's ask isn't worth it, rest a post-only limit order at a fair price
# (maker fees are 0 on most Kalshi markets, at most 1/4 of the taker fee on NFL/NBA).
limit_orders:
  enabled: true
  maker_fee_rate: 0.0175    # conservative: assume the max maker fee
  max_hours: 24             # wait up to a day for our price (always cancelled before the game starts)
  cancel_before_start_minutes: 5
  check_seconds: 30

# Combos (parlays): strong whale picks + player props, one leg per game, each leg used once.
# Small combos get the strongest legs; 5-6 leg combos only use elite legs (84%+ each).
lottery:                    # daily "lottery tickets": many very likely player props in one combo
  enabled: true
  max_hours_ahead: 30
  max_tries: 6              # per lane per day (a new quote request every hour until one fills)
  retry_minutes: 60
  keep_free_usd: 5
  leg_price_slack: 0.02     # a leg may cost up to 2c more than our hit chance (the whole ticket still needs 1.3x value)
  lanes:
    monster:                # 25-35 legs, ~$2.50 -> hundreds/thousands of dollars if every leg hits
      min_legs: 20
      max_legs: 35
      min_leg_chance: 0.85  # each leg 85%+ likely from the player's game log (+ market blend)
      max_per_game: 4       # same-game legs only when their game logs show they hit together
      stake_usd: 2.50
      min_value_ratio: 1.3  # buy only if our hit chance is 1.3x+ the price makers quote
    big:                    # 12-20 legs, ~$7.50
      min_legs: 12
      max_legs: 20
      min_leg_chance: 0.85
      max_per_game: 3
      stake_usd: 7.50
      min_value_ratio: 1.3

combos:
  enabled: true
  dry_run: false            # LIVE: real orders
  min_score: 70             # whale legs
  min_prop_chance: 0.70     # player-prop legs: 70%+ hit chance and a positive edge vs Kalshi
  min_prop_score: 55
  min_hit_chance: 0.30      # never build a combo less likely than 30% to hit
  elite_leg_chance: 0.84    # legs allowed in 5-6 leg combos
  min_stake_usd: 1.0
  # sizing: half-Kelly on the edge (our hit chance vs the price we pay)
  kelly_fraction: 0.5
  max_combo_pct: 0.10       # at most 10% of balance in one combo
  daily_budget_pct: 0.45    # at most 45% of balance in combos per day (55% stays for whale copies)
  min_edge: 0.03            # only buy a combo at least 3c under our fair price (after fee), +1c per day until it settles
  far:                      # combos settling 3+ days out: paid from the future pot, bigger tickets first
    enabled: true
    sizes: [3]              # future-pot parlays: 3 legs max
    elite_leg_chance: 0.80  # legs allowed in 5-6 leg tickets
    min_hit_chance: 0.20
    kelly_fraction: 0.25    # quarter-Kelly on the whole balance (estimate errors multiply across legs)
    max_combo_pct: 0.15     # one ticket: at most 15% of the pot (about $3 of $20)
  # When whale bets are mostly bad prices on Kalshi today (and none good is waiting),
  # parlays may also use the whale share's idle cash, always keeping 15% of the balance free.
  borrow:
    enabled: true
    min_bad_price_skips: 5  # at least 5 whale bets skipped for bad prices today
    max_copy_share: 0.35    # and at most 35% of today's whale bets were copyable
    keep_free_pct: 0.15
    rebuild_hours: 3        # while borrowing, look for new parlays every 3 hours
  # same-game legs: allowed when their game logs show they hit together
  same_game: true
  max_per_game: 3
  min_pair_factor: 1.0      # 1.0 = unrelated or positively linked; below 1 = they hurt each other
  leagues:
    NBA:                    # daily: tonight's games
      every_hours: 20
      max_hours_ahead: 30
      sizes: [2, 3]         # 2-3 leg parlays only (4/4 won; 4+ legs and bigger quote combos lost)
    NFL:                    # upcoming games (this week), rebuilt daily with games not used yet
      every_hours: 20
      max_hours_ahead: 120
      sizes: [2, 3]
    OTHER:                  # whale picks from other leagues (college football etc.)
      every_hours: 20
      max_hours_ahead: 48
      sizes: [2, 3]

# Bankroll mode (sizing: score). Paper mode tracks a virtual bankroll starting here.
bankroll:
  start_usd: 208.49         # live: total deposited (98.49 + 60 + 50 on Oct 22; used for the Return %)
  reserve_usd: 20           # extra deposit kept for strong whale trades + lag trades (shared, first come first served)
  reserve:
    min_score: 80           # strong trade = score 80+ ...
    min_whales: 3           #   ... or 3+ whales on the same side (Best-bets picks always count)
  future_pot_usd: 20        # separate pot: the ONLY money for bets settling 3+ days out (big NFL parlays etc.)
  crypto_pot_usd: 0          # released 10/23: lag + MM off, the $50 now funds parlays, lottery and whale copies
                            # wins refill it to this size, profit above goes to the main bankroll; losses shrink it
  horizon:
    far_days: 3             # settles 3+ days out -> future pot only
    edge_per_day: 0.01      # money locked longer needs more edge: +1% per day until settlement ...
    max_days: 4             #   ... up to +4%
    max_game_total_pct: 0.15  # whale copies + parlay legs on one game: at most 15% of the main bankroll
    pot_max_bet_pct: 0.3    # one whale bet from the pot: at most 30% of the pot
  # Growth plan: heavy while small, taper as the account grows. [min score, % of balance per bet]
  stages:
    - name: "1 growth"
      up_to: 300
      max_game_pct: 0.15
      max_open_pct: 0.95      # growth stage: at most 95% of the main bankroll in play (reserve + pot are extra)
      tiers: [[80, 0.12], [65, 0.07], [45, 0.04]]
    - name: "2 taper"
      up_to: 1000
      max_game_pct: 0.12
      max_open_pct: 0.9
      tiers: [[80, 0.08], [65, 0.05], [45, 0.03]]
    - name: "3 protect"
      up_to: null
      max_game_pct: 0.08
      max_open_pct: 0.8
      tiers: [[80, 0.05], [65, 0.035], [50, 0.02]]
  drawdown_brake_pct: 0.30  # 30% below peak -> use stage 3 sizing until it recovers
  min_ev: 0.0               # skip bets with negative expected value after fees
  max_game_pct: 0.12        # at most 12% of balance on one market
  max_open_pct: 0.90        # keep at least 10% of balance free
  daily_stop_pct: 0.25      # stop new bets for the day after a 25% drop
  min_stake_usd: 1.5
  board:                    # also auto-bet the strongest "Best bets now" picks
    enabled: true
    min_score: 70
    min_whales: 2           # at least 2 proven traders on the same side
    min_ev: 0.0
    max_age_hours: 12       # only fresh whale bets
    consensus_min_whales: 3 # 3+ proven traders on the same side...
    consensus_min_score: 55 #   ...is bet even when no single bet scores 70+

risk:
  sizing: score             # "score" (bankroll % by bet score), "fixed" or "proportional"
  fixed_usd: 25             # $ per copied trade when sizing = fixed
  copy_ratio: 0.01          # default ratio when sizing = proportional
  min_whale_trade_usd: 1000
  max_usd_per_trade: 50
  max_usd_per_market: 150
  max_usd_per_day: 1000       # paper-test limit; lower before going live
  max_slippage: 0.03        # won't pay more than whale price + 3c
  max_entry_price: 0.92     # skip near-certain markets (little upside)
  max_trade_age_seconds: 600   # Polymarket trade feed can lag a few minutes
  always_follow_exits: true # sell when whale sells, even below their price
  time_in_force: fill_or_kill
  fee_rate: 0.07            # Kalshi taker fee estimate: rate x contracts x P x (1-P)
  max_fee_pct: 6            # skip bets where the fee eats more than this % of the stake
